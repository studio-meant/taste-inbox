[project]
name = "taste-inbox-collectors"
version = "0.1.0"
description = "Official-API collectors. Read-only, deterministic, no browser."
requires-python = ">=3.12"
# No runtime dependencies on purpose. These collectors speak to two documented JSON APIs
# over HTTPS; `urllib.request` does that, and a dependency here would be a dependency the
# sandboxed trial runner inherits for no gain.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
probe = "taste_inbox_collectors.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taste_inbox_collectors"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN", "S", "PTH"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]
