[package]
name = "taste-inbox-desktop"
version = "0.1.0"
description = "Taste Inbox desktop host"
authors = ["Taste Inbox"]
edition = "2021"

[lib]
name = "taste_inbox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
url = "2"
