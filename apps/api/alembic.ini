; Migration tooling for the local SQLite database.
; Schemas are introduced in Phase 2 (docs/IMPLEMENTATION_PLAN.md); Phase 0 only
; establishes the tooling and an empty, runnable revision history.
;
; The connection URL is read from DATABASE_URL in migrations/env.py so that no
; filesystem path for personal data is ever committed.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
